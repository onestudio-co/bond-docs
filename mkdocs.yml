site_name: Flutter Bond
site_description: Official documentation for Flutter Bond and Bond Core
site_url: https://example.com/docs
repo_url: https://github.com/onestudio-co/flutter-bond
edit_uri: ''

# Use a dedicated docs directory
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/rocket-launch
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/onestudio-co/bond-core
      name: Bond on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/bond
      name: Bond Discord Community
  search:
    provider: algolia
    algolia_app_id: YOUR_APP_ID
    algolia_api_key: YOUR_SEARCH_API_KEY
    algolia_index_name: YOUR_INDEX_NAME

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false

nav:
  - Home: index.md
  - Overview:
      - overview/index.md
      - What Is Bond: overview/what-is-bond.md
      - Philosophy: overview/philosophy.md
      - Upgrades: overview/upgrades.md
  - Getting Started:
      - getting-started/index.md
      - Environments: getting-started/environment.md
      - Firebase: getting-started/firebase.md
      - Flavors: deployment/flavors.md
  - Core Concepts:
      - Service Providers: core-concepts/service-providers.md
      - Modules & Boundaries: core-concepts/modules-and-boundaries.md
      - Configuration: core-concepts/configuration.md
      - Error Handling: core-concepts/error-handling.md
  - Guides:
      - Data & Networking: data-networking/index.md
      - Forms: forms/index.md
      - Caching: caching/index.md
      - Notifications: notifications/index.md
      - Analytics: analytics/index.md
      - Authentication: guides/authentication.md
  - User Interface:
      - Theming: ui/themes.md
      - Navigation: ui/navigation.md
      - Localization: ui/localization.md
      - Reusable Widgets: ui/reusable-widgets.md
      - Extensions: ui/extensions.md
      - Launcher & Icons: ui/launcher.md
  - Tooling:
      - Bond CLI: tooling/bond-cli.md
      - Monorepo: tooling/monorepo.md
      - Debugging: tooling/debugging-logging.md
      - Change App Name: tooling/change_app_name.md
  - Advanced:
      - advanced-topics/index.md
  - Recipes:
      - cookbook/index.md
  - Deployment:
      - CI/CD: deployment/ci-cd.md
  - Reference:
      - reference/index.md
  - FAQ: faq/index.md
  - Glossary: glossary/index.md

