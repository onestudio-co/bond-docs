site_name: Flutter Bond
site_description: Official documentation for Flutter Bond and Bond Core
site_url: https://example.com/docs
repo_url: https://github.com/onestudio-co/flutter-bond
edit_uri: ''

# Use a dedicated docs directory
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/link-variant

plugins:
  - search
extra:
  search:
    provider: algolia
    algolia_app_id: YOUR_APP_ID
    algolia_api_key: YOUR_SEARCH_API_KEY
    algolia_index_name: YOUR_INDEX_NAME

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false

nav:
  - Home: index.md
  - Prologue:
      - Overview: prologue/index.md
  - Getting Started:
      - Introduction: getting-started/index.md
      - Environment: getting-started/environment.md
      - Firebase: getting-started/firebase.md
  - Architecture Concepts:
      - Service Providers: architecture-concepts/service-providers.md
  - The Basics:
      - Routing & Navigation: user-interface/navigation.md
      - Localization: user-interface/localization.md
      - Theming: user-interface/themes.md
      - Extensions: user-interface/extensions.md
      - Launcher & Splash: user-interface/launcher.md
  - Data & Networking:
      - Overview: data-networking/index.md
  - Forms:
      - Overview: forms/index.md
  - Caching:
      - Overview: caching/index.md
  - Notifications:
      - Overview: notifications/index.md
  - Analytics:
      - Overview: analytics/index.md
  - Tooling:
      - Bond CLI: tooling/bond-cli.md
      - Change App Name: tooling/change_app_name.md
  - Deployment:
      - Flavors: deployment/flavors.md
      - CI/CD: deployment/ci-cd.md
  - Advanced Topics:
      - Index: advanced-topics/index.md
  - Cookbook:
      - Index: cookbook/index.md
  - Reference:
      - Index: reference/index.md
  - FAQ: faq/index.md
  - Glossary: glossary/index.md

