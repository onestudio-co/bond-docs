site_name: Flutter Bond
site_description: Official documentation for Flutter Bond and Bond Core
site_url: https://example.com/docs
repo_url: https://github.com/onestudio-co/flutter-bond
edit_uri: ''

# Use a dedicated docs directory
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    logo: material/link-variant

plugins:
  - search
extra:
  search:
    provider: algolia
    algolia_app_id: YOUR_APP_ID
    algolia_api_key: YOUR_SEARCH_API_KEY
    algolia_index_name: YOUR_INDEX_NAME

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false

nav:
  - Overview:
      - Home: index.md
      - What Is Bond: overview/index.md
      - Philosophy: overview/philosophy.md
      - Upgrades: overview/upgrades.md
  - Getting Started:
      - Install and Create: getting-started/index.md
      - Environments: getting-started/environment.md
      - Firebase: getting-started/firebase.md
      - Flavors: deployment/flavors.md
  - Core Concepts:
      - Service Providers: core-concepts/service-providers.md
      - Modules and Boundaries: core-concepts/modules-and-boundaries.md
      - Configuration: core-concepts/configuration.md
      - Error Handling: core-concepts/error-handling.md
  - Guides:
      - Data and Networking: data-networking/index.md
      - Forms: forms/index.md
      - Caching: caching/index.md
      - Notifications: notifications/index.md
      - Analytics: analytics/index.md
      - Authentication: guides/authentication.md
  - UI:
      - Theming: ui/themes.md
      - Navigation: ui/navigation.md
      - Localization: ui/localization.md
      - Reusable Widgets: ui/reusable-widgets.md
      - Extensions: ui/extensions.md
      - Launcher: ui/launcher.md
  - Tooling:
      - Bond CLI: tooling/bond-cli.md
      - Monorepo: tooling/monorepo.md
      - Debugging and Logging: tooling/debugging-logging.md
      - Change App Name: tooling/change_app_name.md
  - Advanced:
      - Index: advanced-topics/index.md
  - Recipes:
      - Index: cookbook/index.md
  - Deployment:
      - CI/CD: deployment/ci-cd.md
  - Reference:
      - Index: reference/index.md
  - FAQ: faq/index.md
  - Glossary: glossary/index.md

